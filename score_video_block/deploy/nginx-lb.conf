# Load balancer in front of the pickleball-ai replicas (see docker-compose.yml).

# Docker's DNS: the service name resolves to every replica; re-resolved every 10 s
# so scaling up/down or a restarted replica (new IP) is picked up.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream pickleball_ai {
    zone pickleball_ai 64k;
    # A job holds its connection until scored: fewest connections = least loaded.
    least_conn;
    # max_fails=0: a 429 (busy) must not take the replica out of rotation.
    server pickleball-ai:8888 resolve max_fails=0;
    keepalive 32;
}

server {
    listen 8888;
    client_max_body_size 1m;

    location = /lb-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://pickleball_ai;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # Scoring is synchronous: long videos take minutes (backend timeout <= 1800 s).
        proxy_read_timeout 1900s;
        proxy_buffering off;
        # Busy (429/503) or unreachable replica: try the others. Safe for POST because
        # a rejected request was never started, and job_id de-duplicates retries.
        proxy_next_upstream error timeout http_429 http_503 non_idempotent;
        proxy_next_upstream_tries 0;
        proxy_next_upstream_timeout 15s;
    }
}
